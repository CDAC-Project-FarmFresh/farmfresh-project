server:
  servlet:
    context-path: /FarmFresh

spring:
  application:
    name: farmfresh-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/farmfresh?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:manager}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing MySQL schemas (e.g. from Hibernate ddl-auto) have tables but no flyway_schema_history.
    # Baseline at 0 so versioned migrations (V1, …) still run after the metadata table is created.
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:012345678901234567890123456789012345678901234567890123456789012}
    access-expiration-ms: ${JWT_ACCESS_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
