services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: manager
      MYSQL_DATABASE: farmfresh
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/farmfresh?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: manager
      JWT_SECRET: "012345678901234567890123456789012345678901234567890123456789012"
      APP_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
